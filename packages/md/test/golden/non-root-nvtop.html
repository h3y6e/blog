<p>htopのnvidia-smi版的なやつ： <a href="https://github.com/Syllo/nvtop">nvtop</a> <br>
いい感じになるのでオススメ。</p>
<pre><code class="language-bash">$ git clone https://github.com/Syllo/nvtop.git
$ cd nvtop
MATHINLINE0HOME/local
$ make
$ make install
</code></pre>
<p>その後 <code>.zshrc</code> 等に以下を書いて反映させる。</p>
<pre><code class="language-vim">export PATH=MATHINLINE1HOME/local/bin
</code></pre>
